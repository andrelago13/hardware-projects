name: Deploy Plant Monitor Backend

on:
  push:
    branches:
      - main
    paths:
      - "projects/plant-monitor/backend/**"
      - ".github/workflows/deploy-plant-monitor-backend.yml"
  pull_request:
    paths:
      - "projects/plant-monitor/backend/**"
      - ".github/workflows/deploy-plant-monitor-backend.yml"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: plant-monitor-514719
  GCP_REGION: europe-west2
  FUNCTION_NAME: plant-monitor-ingest
  WIF_PROVIDER: projects/377393257/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-deployer@plant-monitor-514719.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: plant-monitor-fn@plant-monitor-514719.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/plant-monitor/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: projects/plant-monitor/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare environment variables file
        env:
          DATABASE_URL: ${{ secrets.PLANT_MONITOR_DATABASE_URL }}
          API_KEY: ${{ secrets.PLANT_MONITOR_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/env.yaml", "w") as f:
              json.dump(
                  {
                      "DATABASE_URL": os.environ["DATABASE_URL"],
                      "API_KEY": os.environ["API_KEY"],
                  },
                  f,
              )
          EOF

      - name: Deploy Cloud Function (Gen 2)
        run: |
          gcloud functions deploy "${{ env.FUNCTION_NAME }}" \
            --gen2 \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --runtime=python312 \
            --source=projects/plant-monitor/backend \
            --entry-point=ingest_reading \
            --trigger-http \
            --allow-unauthenticated \
            --run-service-account="${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --memory=256Mi \
            --min-instances=0 \
            --max-instances=2 \
            --timeout=15s \
            --env-vars-file="${{ runner.temp }}/env.yaml" \
            --quiet

      - name: Show function URL
        run: |
          URL=$(gcloud functions describe "${{ env.FUNCTION_NAME }}" \
            --gen2 \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format="value(serviceConfig.uri)")
          echo "Deployed URL: ${URL}"
